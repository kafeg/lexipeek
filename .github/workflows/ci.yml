name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push stops the run before it, except on main: a run there finishes, the newest push waits for it. A run by
# hand is its own group: it has the ASan and Qt jobs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: core ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # models: pack components for LEXIPEEK_MODELS (scripts/fetch-models.sh, before the build); packs: the same by
          # lexipeek-cli after the build (Windows: no python3 / unzip / zstd in its shell). Cached by their ids.
          - { name: macos-arm64, os: macos-15, models: "langid model-de-en model-en-ru opus-deu_eng_fra_por_spa-sla dict-de-en dict-de-ru dict-en-de dict-en-ru dict-ru-de dict-ru-en" }
          - { name: linux-x64, os: ubuntu-24.04, models: "langid model-de-en model-en-ru opus-deu_eng_fra_por_spa-sla dict-de-en dict-de-ru dict-en-de dict-en-ru dict-ru-de dict-ru-en" }
          - { name: windows-x64, os: windows-2025, packs: "langid dict-de-en dict-de-ru dict-en-de dict-en-ru dict-ru-de dict-ru-en", cmake: "-DLEXIPEEK_QT=OFF" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      TYPE: ${{ matrix.type || 'Release' }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 vcpkg engines/fasttext engines/llama engines/pcre2 tests/inkpeek || git submodule update --init vcpkg engines/fasttext engines/llama engines/pcre2 tests/inkpeek
          git submodule update --init --recursive engines/bergamot
          [ "$RUNNER_OS" = Linux ] || git submodule update --init --recursive --depth 1 engines/qwentts || git submodule update --init --recursive engines/qwentts
          echo "VCPKG_REF=$(git rev-parse HEAD:vcpkg)" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-cache
      # vcpkg's binaries: the newest cache is restored; after Configure it is saved under the hash of the ABIs this
      # build uses (a new compiler or port → a new key), without the zips it does not use (also when a test fails later).
      - uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg3-${{ matrix.name }}-
          restore-keys: |
            vcpkg3-${{ matrix.name }}-
            vcpkg2-${{ matrix.name }}-
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zstd
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja zstd xcodegen || true
      - uses: actions/cache@v4
        if: matrix.models != '' || matrix.packs != ''
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.sh') }}-${{ matrix.models }}${{ matrix.packs }}
      - name: Models
        if: matrix.models != ''
        run: scripts/fetch-models.sh models ${{ matrix.models }} && echo "LEXIPEEK_MODELS=$PWD/models" >> "$GITHUB_ENV"
      # Windows: MSVC's environment, so the core builds by Ninja into the dir the WinUI shell's build reuses.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # The compiler's cache: a push rebuilds only what changed. Saved after Build; on main the older ones are deleted.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/cache/restore@v4
        id: sccache
        with:
          path: .sccache
          key: sccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.name }}-
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$TYPE -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ${{ matrix.cmake }}
      - name: vcpkg cache
        id: abis
        shell: bash
        run: |
          abis=$(grep -h '^Abi:' build/vcpkg_installed/vcpkg/status | cut -d' ' -f2 | tr -d '\r' | sort -u)
          find .vcpkg-cache -name '*.zip' | while read -r f; do echo "$abis" | grep -qx "$(basename "$f" .zip)" || rm "$f"; done
          echo "vcpkg cache: $(find .vcpkg-cache -name '*.zip' | wc -l) zips, $(echo "$abis" | wc -l) ports"
          echo "key=vcpkg3-${{ matrix.name }}-$(echo "$abis" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: vcpkg cache saved?
        id: have
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "n=$(gh cache list --key '${{ steps.abis.outputs.key }}' --json key -q length)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.have.outputs.n == '0'
        with:
          path: .vcpkg-cache
          key: ${{ steps.abis.outputs.key }}
      - name: Build
        run: cmake --build build --config ${{ env.TYPE }} --parallel
      - run: sccache --show-stats
      - uses: actions/cache/save@v4
        if: steps.sccache.outputs.cache-hit != 'true'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}
      - name: Older caches
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.sccache.outputs.cache-primary-key }}
          VCPKG: ${{ steps.abis.outputs.key }}
        run: |
          gh cache list --key sccache-${{ matrix.name }}- --json key -q ".[].key | select(. != \"$KEY\")" | while read -r k; do gh cache delete "$k"; done
          for p in vcpkg2-${{ matrix.name }}- vcpkg3-${{ matrix.name }}-; do
            gh cache list --key $p --json key -q ".[].key | select(. != \"$VCPKG\")" | while read -r k; do gh cache delete "$k"; done
          done
      - name: Packs (Windows)
        if: matrix.packs != ''
        shell: bash
        run: |
          [ -f models/installed.json ] || build/cli/lexipeek-cli --data models packs install ${{ matrix.packs }}
          echo "LEXIPEEK_MODELS=$(cygpath -m "$PWD/models")" >> "$GITHUB_ENV"
      # -V: each test case's time and what was skipped (no model here) in the log.
      - name: Test
        run: ctest --test-dir build -C ${{ env.TYPE }} --output-on-failure -V
      - name: Swift tests (macOS)
        if: runner.os == 'macOS'
        run: make app-test SIGN=-
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: build/packages
          key: nuget-${{ hashFiles('win/packages.config') }}
      - name: WinUI shell (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build-win.cmd build
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: LexiPeek-Windows
          path: build/win/LexiPeek
          retention-days: 7
      # The installer as release.yml makes it (win/LexiPeek.iss), version 0.0.0: it compiles, and can be tried.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" choco install innosetup --version 6.7.1 -y --no-progress || exit /b 1
          "%ISCC%" /Q /DSource=%CD%\build\win\LexiPeek /O%CD%\build\setup win\LexiPeek.iss
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: LexiPeek-Windows-Setup
          path: build/setup/LexiPeek-Windows-Setup.exe
          retention-days: 7
      - name: Backtrace
        if: failure() && runner.os == 'Linux'
        run: |
          grep -m1 -o 'avx[^ ]*' /proc/cpuinfo | sort -u | tr '\n' ' '; lscpu | grep 'Model name'
          sudo apt-get install -y gdb >/dev/null && gdb -batch -ex run -ex bt --args build/tests/lexipeek_tests -tc='fast*' 2>&1 | tail -30
      - name: Translate
        if: matrix.models != ''
        shell: bash
        run: |
          cli=build/cli/lexipeek-cli
          $cli --data models langid "Das Haus am Ende der Straße ist alt."
          $cli --data models translate --from de --to en "Das Haus am Ende der Straße ist alt."
          if [ -d models/opus ]; then $cli --data models translate --from de --to ru --method direct "Das Haus ist alt. Der Garten ist klein."; fi

  # ASan + UBSan on our code, only in a run by hand (gh workflow run ci.yml); locally: make asan
  linux-asan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      MODELS: langid model-de-en dict-de-en dict-de-ru dict-en-de dict-en-ru dict-ru-de dict-ru-en
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: |
          git submodule update --init --depth 1 vcpkg engines/fasttext engines/llama engines/pcre2 tests/inkpeek || git submodule update --init vcpkg engines/fasttext engines/llama engines/pcre2 tests/inkpeek
          git submodule update --init --recursive engines/bergamot
          echo "VCPKG_REF=$(git rev-parse HEAD:vcpkg)" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-cache
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg2-linux-x64-asan-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}-${{ env.ImageVersion }}
          restore-keys: vcpkg2-linux-x64-asan-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}-
      - run: sudo apt-get update && sudo apt-get install -y ninja-build zstd
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.sh') }}-${{ env.MODELS }}
      - run: scripts/fetch-models.sh models $MODELS && echo "LEXIPEEK_MODELS=$PWD/models" >> "$GITHUB_ENV"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLEXIPEEK_SANITIZE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # Windows' fallback shell (qt/), only in a run by hand: gh workflow run ci.yml
  windows-qt:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 vcpkg engines/fasttext engines/llama engines/pcre2 tests/inkpeek || git submodule update --init vcpkg engines/fasttext engines/llama engines/pcre2 tests/inkpeek
          git submodule update --init --recursive engines/bergamot
          git submodule update --init --recursive --depth 1 engines/qwentts || git submodule update --init --recursive engines/qwentts
          echo "VCPKG_REF=$(git rev-parse HEAD:vcpkg)" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-cache
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-x64-qt-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}
          restore-keys: |
            vcpkg-windows-x64-qt-
            vcpkg-windows-x64-
      - name: Qt shell
        shell: cmd
        run: scripts\build-win.cmd build-qt qt
