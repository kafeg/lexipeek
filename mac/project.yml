name: LexiPeek

options:
  bundleIdPrefix: dev.kafeg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"  # make app sets 0.1.<commits> (Makefile's VERSION)
    CURRENT_PROJECT_VERSION: "0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  # Pure Swift parts (shortcuts, placement, recents, URLs): the unit tests link it without the core.
  LexiPeekKit:
    type: library.static
    platform: macOS
    sources: [Sources/LexiPeekKit]
    settings:
      base:
        PRODUCT_NAME: LexiPeekKit
        SKIP_INSTALL: YES

  LexiPeek:
    type: application
    platform: macOS
    sources:
      - Sources/LexiPeek
      - path: Bridge
        buildPhase: none
    dependencies:
      - target: LexiPeekKit
        embed: false
    configFiles:
      Debug: ../build/mac/link.xcconfig
      Release: ../build/mac/link.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kafeg.lexipeek
        PRODUCT_NAME: LexiPeek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Bridge
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../core/include $(PROJECT_DIR)/Bridge
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../build/mac
        OTHER_LDFLAGS: $(inherited) $(LEXIPEEK_LDFLAGS)
        DEAD_CODE_STRIPPING: YES
    info:
      path: Sources/LexiPeek/Info.plist
      properties:
        CFBundleName: LexiPeek
        CFBundleDisplayName: LexiPeek
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.reference
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License."
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: dev.kafeg.lexipeek
            CFBundleURLSchemes: [lexipeek]
        NSServices:
          - NSMessage: lookUp
            NSPortName: LexiPeek
            NSMenuItem:
              default: Look up in LexiPeek
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
            NSRequiredContext: {}

  LexiPeekKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LexiPeekKitTests]
    dependencies:
      - target: LexiPeekKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kafeg.lexipeek.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LexiPeek:
    build:
      targets:
        LexiPeek: [run, profile, analyze, archive]
        LexiPeekKitTests: [test]
    test:
      config: Debug
      targets: [LexiPeekKitTests]
